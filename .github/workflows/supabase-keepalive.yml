name: Supabase Keep Alive

# Esegue ogni 3 giorni alle 07:00 UTC per prevenire la pausa del DB free tier.
# Supabase pausa i progetti free dopo 7 giorni di inattività: pingandolo ogni
# 3 giorni restiamo sempre ampiamente sotto la soglia.
#
# In più, protegge SE STESSO dalla disabilitazione automatica: GitHub disabilita
# i workflow schedulati dopo 60 giorni senza attività (commit) nel repository.
# Se lo sviluppo si ferma a lungo, senza questa protezione il cron morirebbe e
# di conseguenza Supabase andrebbe comunque in pausa. Lo step finale fa un commit
# vuoto SOLO se l'ultimo commit è più vecchio di 50 giorni, azzerando il contatore.
#
# Può essere triggerato manualmente da GitHub Actions per testare.

on:
  schedule:
    - cron: '0 7 */3 * *'   # ogni 3 giorni alle 07:00 UTC
  workflow_dispatch:         # trigger manuale per test

permissions:
  contents: write            # necessario per il commit anti-disabilitazione

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0     # serve la history per leggere la data dell'ultimo commit

      - name: Ping Supabase REST API
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmbW1jdnh6aHdka216aHN4Y3ZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2Nzk1ODAsImV4cCI6MjA5MzI1NTU4MH0.LH8h4Fivtl3-TuiA050oF8iS4b80xrd2Dn6z8JjCoeA" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmbW1jdnh6aHdka216aHN4Y3ZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc2Nzk1ODAsImV4cCI6MjA5MzI1NTU4MH0.LH8h4Fivtl3-TuiA050oF8iS4b80xrd2Dn6z8JjCoeA" \
            "https://ifmmcvxzhwdkmzhsxcvb.supabase.co/rest/v1/impostazioni?select=chiave&limit=1")

          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Supabase attivo e raggiungibile"
          else
            echo "Risposta inattesa: $HTTP_STATUS"
            exit 1
          fi

      - name: Anti-disabilitazione Actions (commit vuoto se repo inattivo da >50 giorni)
        run: |
          LAST_COMMIT_TS=$(git log -1 --format=%ct)
          NOW_TS=$(date +%s)
          DAYS_SINCE=$(( (NOW_TS - LAST_COMMIT_TS) / 86400 ))
          echo "Giorni dall'ultimo commit: $DAYS_SINCE"

          if [ "$DAYS_SINCE" -ge 50 ]; then
            git config user.name  "keepalive-bot"
            git config user.email "keepalive-bot@users.noreply.github.com"
            # [skip ci] evita di triggerare notify-deploy / build inutili
            git commit --allow-empty -m "chore: keepalive per evitare disabilitazione GitHub Actions [skip ci]"
            git push
            echo "Commit vuoto di keepalive effettuato (repo era inattivo da $DAYS_SINCE giorni)"
          else
            echo "Repo attivo di recente ($DAYS_SINCE giorni): nessun commit necessario"
          fi
