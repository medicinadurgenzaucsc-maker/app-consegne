name: Keepalive

# Tiene attivo il progetto Supabase free. Storia (24/08/2026): i keepalive in
# sola LETTURA (GET tabella o RPC read-only) NON alimentano il contatore di
# attivita' di Supabase: i run erano verdi ma il progetto andava in pausa lo
# stesso. Standard v3, l'unico dimostrato robusto:
#   1. controlla lo stato via Management API; se in pausa fa RESTORE da solo
#      (anche nel caso peggiore il fermo massimo e' ~24h)
#   2. heartbeat di SCRITTURA vera sul DB (update keepalive.updated_at)
#   3. verifica end-to-end: RPC ping() via REST anon, che a sua volta SCRIVE
#      (hard-fail: se fallisce il run e' rosso e arriva l'email di GitHub)
#   4. commit vuoto se il repo e' fermo da 45+ gg (GitHub spegne i cron a 60)
# Dalla v195 «un codice, tante configurazioni»: il reparto si riconosce dalla
# variabile CLOUDFLARE_PROGETTO del repository, la stessa del flusso di
# pubblicazione (collaudo/strumenti/keepalive.js); progetto,
# indirizzo e chiave pubblica vengono dal suo file in reparti/, e a fine giro
# l'esito va alla centrale, se il file la nomina. Gira quindi anche nel
# repository del collaudo, con la sua chiave.
#   segreto SUPABASE_MGMT_TOKEN   chiave di gestione dell'account Supabase del reparto
on:
  schedule:
    - cron: '7 5 * * *'   # ogni giorno
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reparto di questo repository
        id: reparto
        env:
          PROGETTO: ${{ vars.CLOUDFLARE_PROGETTO }}
        run: |
          out=$(node collaudo/strumenti/keepalive.js reparto "$PROGETTO" "$GITHUB_REPOSITORY")
          printf '%s\n' "$out" >> "$GITHUB_OUTPUT"

      - name: Il segreto SUPABASE_MGMT_TOKEN c'è
        id: segreto
        env:
          MGMT: ${{ secrets.SUPABASE_MGMT_TOKEN }}
        run: test -n "$MGMT" || { echo "::error::manca il segreto SUPABASE_MGMT_TOKEN"; exit 1; }

      - name: Stato progetto + auto-restore se in pausa
        id: stato
        env:
          MGMT: ${{ secrets.SUPABASE_MGMT_TOKEN }}
          REF: ${{ steps.reparto.outputs.ref }}
        run: |
          status=$(curl -sS -H "Authorization: Bearer $MGMT" "https://api.supabase.com/v1/projects/$REF" | sed -nE 's/.*"status":"([^"]*)".*/\1/p')
          echo "Stato: $status"
          if [ "$status" != "ACTIVE_HEALTHY" ]; then
            echo "Progetto non attivo -> restore..."
            curl -sS -X POST -H "Authorization: Bearer $MGMT" -H "Content-Type: application/json" -d '{}' \
              -o /dev/null -w "restore HTTP %{http_code}\n" "https://api.supabase.com/v1/projects/$REF/restore"
            for i in $(seq 1 30); do
              sleep 10
              status=$(curl -sS -H "Authorization: Bearer $MGMT" "https://api.supabase.com/v1/projects/$REF" | sed -nE 's/.*"status":"([^"]*)".*/\1/p')
              echo "  attesa $i: $status"
              [ "$status" = "ACTIVE_HEALTHY" ] && break
            done
          fi
          test "$status" = "ACTIVE_HEALTHY"

      - name: Heartbeat SQL (scrittura vera sul DB)
        id: heartbeat
        env:
          MGMT: ${{ secrets.SUPABASE_MGMT_TOKEN }}
          REF: ${{ steps.reparto.outputs.ref }}
        run: |
          out=$(curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $MGMT" -H "Content-Type: application/json" \
            -d '{"query":"update public.keepalive set updated_at = now() where id = 1 returning updated_at;"}')
          echo "Heartbeat: $out"
          echo "$out" | grep -q "updated_at"

      - name: Verifica end-to-end (RPC ping via REST anon, scrive anche lei)
        id: ping
        env:
          URL: ${{ steps.reparto.outputs.url }}
          ANON: ${{ steps.reparto.outputs.chiave }}
        run: |
          code=$(curl -sS -o /tmp/r -w "%{http_code}" -X POST \
            "$URL/rest/v1/rpc/ping" \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
            -H "Content-Type: application/json" -d '{}')
          echo "RPC ping -> HTTP $code"; cat /tmp/r 2>/dev/null; echo
          test "$code" = "200"

      - name: Rinnova il repo se fermo da 45+ giorni (anti-disable cron)
        id: rinnovo
        run: |
          DIFF=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Giorni dall'ultimo commit: $DIFF"
          if [ "$DIFF" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive heartbeat [skip ci]"
            git push
          else
            echo "Nessun rinnovo necessario"
          fi

      - name: Esito alla centrale
        if: always() && steps.reparto.outputs.centrale != ''
        env:
          CENTRALE: ${{ steps.reparto.outputs.centrale }}
          REPARTO: ${{ steps.reparto.outputs.codice }}
          AMBIENTE: ${{ steps.reparto.outputs.ambiente }}
          FLUSSO: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ESITO_SEGRETO: ${{ steps.segreto.outcome }}
          ESITO_STATO: ${{ steps.stato.outcome }}
          ESITO_HEARTBEAT: ${{ steps.heartbeat.outcome }}
          ESITO_PING: ${{ steps.ping.outcome }}
          ESITO_RINNOVO: ${{ steps.rinnovo.outcome }}
        run: node collaudo/strumenti/keepalive.js segnala
